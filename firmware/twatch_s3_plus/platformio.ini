[env:lilygo-twatch-s3-plus]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=13
    -DTFT_SCLK=18
    -DTFT_CS=12
    -DTFT_DC=38
    -DTFT_RST=-1
    -DTFT_BL=45
    -DSPI_FREQUENCY=80000000
    -DLOAD_GLCD=1

; MVP sem radio sub-GHz e sem GNSS (ver DECISIONS.md D16)
lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
    lewisxhe/XPowersLib@^0.2.9
    lewisxhe/SensorLib@^0.2.4 ; inclui TouchDrvFT6X36, SensorBMA423 e SensorDRV2605
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
