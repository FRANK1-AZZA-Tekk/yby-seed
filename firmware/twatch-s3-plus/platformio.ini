"""
PlatformIO Configuration — LilyGO T-Watch S3 Plus (ESP32-S3)

Responsabilidade:
- Configurar build environment (ESP-IDF, Arduino, LVGL)
- Otimizar para baixo consumo (flags de energia)
- Habilitar debug (heap tracing, coredump)

Licença: MIT
"""

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:twatch_s3_plus]
platform = espressif32 @ 6.7.0
board = esp32-s3-devkitc-1
framework = arduino

; === Board Configuration ===
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = qspi_opi

; === Partition Table (OTA + NVS) ===
board_build.partitions = min_spiffs.csv

; === Serial Monitor ===
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; === Build Flags ===
build_flags =
    ; Otimizações de energia
    -D CONFIG_FREERTOS_HZ=100
    -D CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240
    
    ; LVGL (display)
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_USE_LOG=1
    -D LV_LOG_LEVEL=LV_LOG_LEVEL_WARN
    
    ; MQTT+TLS (habilitar em produção)
    ; -D MQTT_SECURE
    
    ; Debug (heap tracing, coredump)
    -D CONFIG_HEAP_TRACING=y
    -D CONFIG_ESP_COREDUMP_ENABLE=y
    
    ; PSRAM (8MB)
    -D BOARD_HAS_PSRAM
    -D ARDUINO_ESP32S3_DEV
    
    ; WiFi power save (desativar para menor latência)
    -D CONFIG_LWIP_TCP_KEEPALIVE=y

; === Libraries ===
lib_deps =
    ; LVGL (display UI)
    lvgl/lvlg@^8.3.0
    
    ; MQTT client
    joelchristensen/AsyncMqttClient@^2.3.2
    
    ; WiFi manager (auto-connect)
    tzapu/WiFiManager@^0.16.0
    
    ; Sensors (MAX30102, BMM150, etc.)
    sparkfun/SparkFun MAX3010x Pulse Ox Sensor Arduino Library@^1.1.1
    boschsensortec/Bosch-BMM150@^1.2.0
    
    ; JSON
    bblanchon/ArduinoJson@^7.0.3
    
    ; NVS (Non-Volatile Storage)
    ; Já incluso no framework Arduino

; === Upload Options ===
upload_protocol = esptool
upload_speed = 921600
upload_port = /dev/ttyUSB0  ; Ajustar para seu sistema

; === Debug Options ===
debug_tool = esp-builtin
debug_init_break = tbreak setup
debug_speed = 40000
