model_list:
  # Rota local explícita. Provedores externos devem ser configurados em aliases
  # separados e chamados somente após a política de privacidade e consentimento.
  - model_name: yby-local
    litellm_params:
      model: ollama_chat/qwen2.5-coder:3b-instruct-q4_K_M
      api_base: http://ollama:11434
      timeout: 60

router_settings:
  routing_strategy: simple-shuffle
  set_verbose: false
  num_retries: 0
  timeout: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: sqlite:///litellm_logs.db
