name: Strix Security Scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  strix-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Strix credentials
        id: creds
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$STRIX_LLM" ] || [ -z "$LLM_API_KEY" ]; then
            echo "::warning::STRIX_LLM/LLM_API_KEY ausentes — scan Strix pulado (não bloqueia o PR)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine diff base
        if: steps.creds.outputs.skip != 'true'
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="${BASE_REF:-main}"
          git fetch origin "$base" --no-tags
          git rev-parse --verify "refs/remotes/origin/$base^{commit}" >/dev/null
          echo "base=origin/$base" >> "$GITHUB_OUTPUT"

      - name: Install pinned Strix v1.7.0
        if: steps.creds.outputs.skip != 'true'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/strix.tar.gz \
            https://github.com/usestrix/strix/releases/download/v1.7.0/strix-1.7.0-linux-x86_64.tar.gz
          echo "b8cd7e84d63cbeff6726301a9e08fddedf40fc6a4edcdb4edda8a853b3312de6  /tmp/strix.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/strix.tar.gz -C "$HOME/.local/bin" strix-1.7.0-linux-x86_64
          mv "$HOME/.local/bin/strix-1.7.0-linux-x86_64" "$HOME/.local/bin/strix"
          chmod 755 "$HOME/.local/bin/strix"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Strix scan
        if: steps.creds.outputs.skip != 'true'
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DIFF_BASE: ${{ steps.diff.outputs.base }}
        run: |
          set -o pipefail
          strix -n --target ./ --scan-mode quick --scope-mode diff \
            --diff-base "$DIFF_BASE" --fail-on high \
            --max-budget 5 --max-turns 150 \
            2>&1 | tee strix-output.log

      - name: Upload Strix diagnostics
        if: always() && steps.creds.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: strix-report
          path: |
            .strix/**
            strix_runs/**
            strix-report*/**
            strix-output.log
          if-no-files-found: ignore
