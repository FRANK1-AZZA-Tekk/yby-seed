name: CI

on:
  push:
    branches: [main, ci-fix, feat/pydantic-validacao-execution]
  pull_request:
    branches: [main, feat/pydantic-validacao-execution]

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libssl-dev \
            libffi-dev \
            python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest-cov

      - name: Pre-compile llama-cpp-python (no CUDA)
        env:
          CMAKE_ARGS: "-DGGML_CUDA=OFF"
        run: |
          pip install --no-cache-dir llama-cpp-python

      - name: Lint (ruff + mypy)
        run: |
          ruff check src tests
          mypy src tests --ignore-missing-imports --no-strict-optional

      - name: Run all unit tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --ignore=tests/test_gateway.py \
            --ignore=tests/test_rag.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
