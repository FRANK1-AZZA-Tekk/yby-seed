name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  # Testes do servidor (Python + Docker)
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r tests/requirements.txt

      - name: Run tests
        run: |
          cd tests
          pytest -v --cov=server --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./tests/coverage.xml
          flags: server

  # Testes do wearable (PlatformIO)
  test-wearable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PlatformIO
        uses: actions/checkout@v4
      - run: |
          pip install platformio
          cd wearable
          pio test -e native

  # Build Docker images
  build-docker:
    runs-on: ubuntu-latest
    needs: [test-server]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./process-manager
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/process-manager:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/process-manager:latest

  # Deploy documentação (MkDocs)
  deploy-docs:
    runs-on: ubuntu-latest
    needs: [test-server, test-wearable]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material

      - name: Deploy to GitHub Pages
        run: |
          cd docs
          mkdocs gh-deploy --force
