version: '3.8'

# YBY SEED — compose safe defaults for local-first development.
# Copy docker-compose.env.example to .env and fill local values; never commit .env.
services:
  ollama:
    image: ollama/ollama:0.12.11
    container_name: yby-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Ollama API has no built-in local API authentication. Keep it host-local.
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 10s
      retries: 3

  nodered:
    image: nodered/node-red:4.1.4
    container_name: yby-node-red
    restart: unless-stopped
    ports:
      - "${TAILSCALE_HOST_IP:?Set TAILSCALE_HOST_IP in .env}:1880:1880"
    volumes:
      - ./nodered/data:/data
      - ./nodered/flows:/flows
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      - mosquitto
      - ollama

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: yby-mosquitto
    restart: unless-stopped
    # Keep broker internal; publish only after configuring authentication/ACLs.
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  postgres:
    image: postgres:16.10
    container_name: yby-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: yby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: yby_seed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yby -d yby_seed"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.4.2-alpine
    container_name: yby-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: yby-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/config:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: yby-grafana
    restart: unless-stopped
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${TAILSCALE_HOST_IP:?Set TAILSCALE_HOST_IP in .env}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus

volumes:
  ollama_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: yby-seed-network
    driver: bridge
