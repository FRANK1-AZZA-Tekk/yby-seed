# Opcional: Qdrant para RAG legado (src/rag) e serviços da malha de 4 nós (--profile mesh).
# O núcleo v1 (yby ask) não exige Docker — D5.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: yby-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    mem_limit: 1g

  postgres:
    image: pgvector/pgvector:pg16
    container_name: yby-pgvector
    profiles: ["mesh"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${YBY_PG_DB:-yby_mesh}
      POSTGRES_USER: ${YBY_PG_USER:-yby}
      POSTGRES_PASSWORD: ${YBY_PG_PASSWORD:-changeme-local-only}
    ports:
      - "${YBY_BIND_HOST:-127.0.0.1}:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    container_name: yby-redis
    profiles: ["mesh"]
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${YBY_BIND_HOST:-127.0.0.1}:6379:6379"
    volumes:
      - ./data/redis:/data
    mem_limit: 256m

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: yby-mosquitto
    profiles: ["mesh"]
    restart: unless-stopped
    ports:
      - "${YBY_BIND_HOST:-127.0.0.1}:1883:1883"
    volumes:
      - ./data/mosquitto:/mosquitto/data
    mem_limit: 128m

  # Sandbox REA (opt-in): `docker compose --profile rea run --rm -T rea-sandbox`
  # Somente leitura, sem rede, sem capabilities. Coloque dumps em ./data/firmware.
  rea-sandbox:
    build:
      context: .
      dockerfile: docker/rea-sandbox/Dockerfile
      args:
        INSTALL_GHIDRA: ${YBY_REA_INSTALL_GHIDRA:-0}
    image: yby-rea-sandbox:local
    container_name: yby-rea-sandbox
    profiles: ["rea"]
    read_only: true
    network_mode: none
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 256
    user: "10001:10001"
    stdin_open: true
    environment:
      YBY_REA_FIRMWARE_DIR: /firmware
    tmpfs:
      - /tmp:size=128m,nosuid,nodev
    volumes:
      - ./data/firmware:/firmware:ro
