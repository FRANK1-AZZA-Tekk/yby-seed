# =============================================================================
# YBY SEED — Configuração LiteLLM (Malha de 4 Nós — D3/D4/D12/D15)
# Roteamento em cascata: local rápido -> 7B híbrido -> nuvem sob demanda -> mobile failover
# Regra inviolável: rotas locais/privadas NUNCA escalam para nuvem.
# Documentação: docs/PLANEJAMENTO-CUSTOS-IA.md e DECISIONS.md (D15)
# =============================================================================

model_list:
  # --- Padrão D4 (compatibilidade `yby-local`) ---
  - model_name: yby-local
    litellm_params:
      model: ollama/qwen2.5-coder:3b
      api_base: os.environ/OLLAMA_API_BASE

  # --- Nível 1 (yby-fast): 3B–4B em VRAM da GTX 1650 (4 GB) ---
  # Triagem estruturada (GBNF/XGrammar), comandos de voz Baseus/T-Watch e classificação.
  - model_name: yby-fast
    litellm_params:
      model: ollama/qwen2.5-coder:3b
      api_base: os.environ/OLLAMA_API_BASE

  # --- Nível 2 (yby-code): 7B híbrido GPU+RAM no PC Hub (16 GB DDR4) ---
  # Geração de micro-apps YBY Fórum, síntese RAG (pgvector) e tools Hermes.
  - model_name: yby-code
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: os.environ/OLLAMA_API_BASE

  # --- Nível 3 (yby-cloud-frontier): Nuvem sob demanda (SOMENTE não-privado) ---
  # Bloqueado pelo PrivacyGate para payloads `sensitivity="private"`.
  - model_name: yby-cloud-frontier
    litellm_params:
      model: openrouter/openrouter/free

  # --- Nível 4 (yby-mobile-fallback): Failover offline no Xiaomi 12 (PocketPal :8080) ---
  # Acionado automaticamente quando o PC Hub está offline ou em manutenção.
  - model_name: yby-mobile-fallback
    litellm_params:
      model: openai/qwen2.5-coder-3b-instruct
      api_base: os.environ/YBY_POCKETPAL_BASE_URL
      api_key: pocketpal-local

  # --- Aliases legados preservados para compatibilidade ---
  - model_name: yby-free
    litellm_params:
      model: openrouter/openrouter/free

  - model_name: yby-smart
    litellm_params:
      model: openrouter/deepseek/deepseek-chat-v3.1

  - model_name: yby-critical
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.5

# -----------------------------------------------------------------------------
# Roteamento com fallback estritamente descendente/local
# Nenhuma rota local (yby-local, yby-fast, yby-code) cai para nuvem.
# -----------------------------------------------------------------------------
router_settings:
  fallbacks:
    - yby-cloud-frontier: [yby-code, yby-fast, yby-mobile-fallback]
    - yby-code: [yby-fast, yby-mobile-fallback]
    - yby-fast: [yby-local, yby-mobile-fallback]
    - yby-local: [yby-mobile-fallback]
    - yby-free: [yby-local, yby-mobile-fallback]
    - yby-smart: [yby-free, yby-code, yby-local]
    - yby-critical: [yby-smart, yby-code, yby-local]
  routing_strategy: latency-based-routing
  num_retries: 2
  timeout: 120

# -----------------------------------------------------------------------------
# Controle de gastos (proteção do crédito — D12)
# -----------------------------------------------------------------------------
litellm_settings:
  drop_params: true
  max_budget: 10.0          # teto total do crédito (US$)
  budget_duration: 30d      # janela de renovação mensal

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
