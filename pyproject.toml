[project]
name = "yby-seed"
version = "0.1.0"
description = "YBY SEED — orquestrador local-first (Function Over Form). CLI: uv run python -m src.yby_seed.<módulo>"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.55.0",
    "docker>=7.1.0",
    "paho-mqtt>=2.1.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "loguru>=0.7.0",
]
forge = ["vastai>=0.3.0"]
pdf = ["pypdf>=5.0.0"]
hardware = ["pyserial>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yby_seed"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
