[project]
name = "yby-seed"
version = "0.2.0"
description = "YBY SEED — Local-first cognitive hub and 4-node edge mesh"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "loguru>=0.7.0",
    "rich>=13.7.0",
    "textual>=0.40.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "paho-mqtt>=1.6.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mesh = [
    "redis>=5.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# O default do Ruff 0.17 inclui UP, SIM e E501 e marca centenas de achados
# anteriores a este PR. O CI aplica pyflakes e erros de sintaxe (E9) para o
# job chegar aos testes. O código novo também fica limpo em E, F e I.
select = ["E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
